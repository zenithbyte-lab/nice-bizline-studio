[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizdir-crawler"
version = "0.1.0"
description = "Non-browser BizDirLib crawler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jinja2>=3.1",
  "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["bizdir_crawler"]
py-modules = ["kor_bizdirlib_fetch", "windows_launcher"]
include-package-data = true

[tool.setuptools.package-data]
bizdir_crawler = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
