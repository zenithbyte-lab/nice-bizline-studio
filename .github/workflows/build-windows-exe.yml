name: Build KorBizDir Studio EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "bizdir_crawler/**"
      - "windows_launcher.py"
      - "pyproject.toml"
      - "README.md"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name KorBizDirStudio `
            --collect-data bizdir_crawler `
            --collect-submodules uvicorn `
            --collect-submodules fastapi `
            --collect-submodules starlette `
            --collect-submodules multipart `
            --collect-submodules python_multipart `
            windows_launcher.py

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\KorBizDirStudio.exe release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath KorBizDirStudio-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KorBizDirStudio-windows
          path: KorBizDirStudio-windows.zip
          if-no-files-found: error
